[package]
name = "vexel-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vexel"
path = "main.rs"

[dependencies]
vexel = { path = "../vexel" }
clap = { version = "4.5.20", features = ["derive"] }
glob = "0.3.1"
egui = "0.36.1"
eframe = "0.36.1"
font-kit = "0.14.3"
jpegxl-sys = { version = "0.13.0", features = ["vendored"] }
webp = "0.3.0"
libc = "0.2"

[build-dependencies]
winres = "0.1"

[lints]
workspace = true