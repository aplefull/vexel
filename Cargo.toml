[workspace]
resolver = "2"
members = [
    "vexel",
    "vexel-cli",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
upper_case_acronyms = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
chunks_exact_to_as_chunks = "allow"

[profile.release]
debug=1
opt-level = 3

[profile.dist]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1
strip = true
