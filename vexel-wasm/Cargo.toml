[package]
name = "vexel-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
vexel = { path = "../vexel", default-features = false, features = ["tsify"] }
wasm-bindgen = "0.2"
js-sys = "0.3.76"
serde = { version = "1.0.217", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen-rayon = { version = "1.2", optional = true }

[features]
default = ["rayon"]
rayon = ["vexel/rayon", "dep:wasm-bindgen-rayon"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-threads",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-reference-types",
    "--enable-multivalue",
    "--enable-simd",
]

[lints]
workspace = true
