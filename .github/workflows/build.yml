name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pgo: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pgo: true
          - os: macos-latest
            target: aarch64-apple-darwin
            pgo: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/vexel/tests/
            !/vexel/benches/images/
            !/vexel/fuzz/

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install toolchain
        run: rustup toolchain install --profile minimal

      - name: Build
        run: cargo build --package vexel-cli --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.pgo && format('-Cprofile-use={0}/pgo/vexel.profdata', github.workspace) || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vexel-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/vexel
            target/${{ matrix.target }}/release/vexel.exe
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/pgo/
            !/vexel/tests/
            !/vexel/benches/images/
            !/vexel/fuzz/

      - name: Install toolchain
        run: rustup toolchain install --profile minimal

      - uses: extractions/setup-just@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build
        run: just build wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vexel-wasm
          path: target/wasm-pkg/
          if-no-files-found: error
